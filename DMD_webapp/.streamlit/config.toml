[server]
headless = true
address = "localhost"
port = 8501
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#1f4e79"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f0f4f8"
textColor = "#1a1a1a"
font = "sans serif"

[ui]
hideTopBar = true

[client]
showSidebarNavigation = true
