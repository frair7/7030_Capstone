# DMD Mutation and Exon-Skipping Explorer — project dependencies
# Update existing env (do NOT use --prune; 7030_capstone also contains R/Jupyter):
#
#   module load miniconda3/24.1.2-py310
#   conda activate 7030_capstone
#   conda env update --name 7030_capstone --file cursor_ai/environment.yml
#
name: 7030_capstone
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python=3.10
  - streamlit>=1.32,<2
  - pandas>=2.1,<3
  - numpy>=1.26,<3
  - plotly>=5.18,<6
  - matplotlib>=3.8,<4
  - biopython>=1.83,<2
  - pytest>=8,<9
  - requests>=2.31,<3
  - pydantic>=2.6,<3
  - pip
  - pip:
      - typing-extensions>=4.9
